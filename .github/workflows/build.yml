name: Build per ABI and platform

# Build trên mọi commit (push/PR) + cho phép bấm tay. Mỗi ABI/nền tảng một job
# riêng nên một target hỏng không kéo cả matrix đỏ. Artifact giữ 14 ngày.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Termux chạy userspace linux — build GOOS=linux, KHÔNG dùng GOOS=android
          # (GOOS=android bắt buộc CGO + NDK, Termux không cần).
          - name: termux-armeabi-v7a
            goos: linux
            goarch: arm
            goarm: '7'
            output: tmr-bot-termux-armeabi-v7a
          - name: termux-arm64-v8a
            goos: linux
            goarch: arm64
            goarm: ''
            output: tmr-bot-termux-arm64-v8a
          - name: termux-x86
            goos: linux
            goarch: '386'
            goarm: ''
            output: tmr-bot-termux-x86
          - name: termux-x86_64
            goos: linux
            goarch: amd64
            goarm: ''
            output: tmr-bot-termux-x86_64

          # Máy chủ / PC / desktop.
          - name: linux-amd64
            goos: linux
            goarch: amd64
            goarm: ''
            output: tmr-bot-linux-amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
            goarm: ''
            output: tmr-bot-linux-arm64
          - name: windows-amd64
            goos: windows
            goarch: amd64
            goarm: ''
            output: tmr-bot-windows-amd64.exe
          - name: macos-arm64
            goos: darwin
            goarch: arm64
            goarm: ''
            output: tmr-bot-macos-arm64
          - name: macos-amd64
            goos: darwin
            goarch: amd64
            goarm: ''
            output: tmr-bot-macos-amd64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.name }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags "-s -w" -o "${{ matrix.output }}" .
          go version -m "${{ matrix.output }}"
          sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: |
            ${{ matrix.output }}
            ${{ matrix.output }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    # Chỉ chạy khi push tag v* (vd v1.4.1). Build matrix ở trên là dependency.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify version in main.go matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(grep -E '^var version = ' main.go | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$ver" != "${TAG#v}" ]; then
            echo "Tag $TAG nhưng main.go version $ver — hãy bump version trước khi tag" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG (${SHA::7})" \
            --generate-notes \
            --verify-tag
