# TMR Discord Bot Configuration

# Bot Settings
bot:
  prefix: "!"
  status: "TMR Auto Server"

# Auto Server Settings
auto:
  # Auto change server icon (requires boost level 1+)
  icon_enabled: true
  # Auto change server banner (requires boost level 2+)
  banner_enabled: true
  # Interval in seconds between each auto change (minimum 60)
  interval: 300

# Wallhaven API Settings
wallhaven:
  # API key (optional, leave empty for public API)
  api_key: ""
  # Categories: anime, general, people (1=on, 0=off)
  # 100 = anime only, 010 = general only, 110 = anime + general
  categories:
    anime: 1
    general: 0
    people: 0
  # Purity: sfw, sketchy, nsfw (1=on, 0=off)
  purity:
    sfw: 1
    sketchy: 0
    nsfw: 0
  # Sorting: date_added, views, favorites, random
  sorting: random
  # For banner: filter by ratio (16:9 recommended)
  # For icon: filter by ratio (1:1 recommended)
  banner_ratio: "16x9"
  icon_ratio: "1x1"
