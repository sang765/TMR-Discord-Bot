# TMR Discord Bot Configuration

# Bot Settings
bot:
  prefix: "!"
  status: "TMR Auto Server"

# Image Source: konachan, zerochan
source: "konachan"

# Auto Server Settings
auto:
  # Auto change server banner (requires boost level 2+)
  # Icon is now manual only via !seticon
  banner_enabled: true
  # Interval in seconds between each auto change (minimum 60)
  interval: 300

# Konachan API Settings (konachan.net)
konachan:
  # Tags for filtering (space separated)
  # Examples: "landscape score:>50"
  icon_tags: "long_hair"
  banner_tags: "landscape"
  # Rating: s (safe), q (questionable), e (explicit)
  rating: "s"
  # Minimum score (0 = disabled)
  min_score: 30

# ZeroChan API Settings (zerochan.net)
# Note: Requires User-Agent header with project name and username
zerochan:
  # Tags for filtering (Title Case with spaces)
  tags: "1girl"

# Wallhaven API Settings (wallhaven.cc)
# Note: Only anime category images
wallhaven:
  # Tags for filtering (optional)
  tags: ""

# MoeWalls Settings (moewalls.com)
# Note: Requires ffmpeg for video to GIF conversion
moewalls:
  enabled: false
